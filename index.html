<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青埔國中114暑假綜合測驗系統</title>
    <style>
        /* 移除瀏覽器預設的邊距，讓網頁全螢幕顯示 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Headline Chinas", "Microsoft JhengHei", sans-serif;
        }

        /* 為了精準定位，需要一個相對定位的容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 嵌入的 Google Apps Script 網頁 */
        .embedded-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 右下角圓形連絡管理員按鈕 */
        .contact-fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 999;
            transition: background-color 0.2s, transform 0.2s;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.2;
            cursor: pointer;
        }

        .contact-fab:hover {
            background-color: #1557b0;
            transform: scale(1.05);
        }

        /* 彈出視窗背景遮罩（預設隱藏） */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* 彈出視窗主體 */
        .modal-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 500px;
            height: 80%;
            max-height: 600px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 彈出視窗的標題列 */
        .modal-header {
            background-color: #f1f3f4;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dadce0;
            z-index: 1001;
        }

        .modal-title {
            font-size: 16px;
            font-weight: bold;
            color: #3c4043;
        }

        /* 關閉按鈕 */
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #5f6368;
            line-height: 1;
        }

        .close-btn:hover {
            color: #202124;
        }

        /* 彈出視窗內容容器 */
        .modal-body {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="contact-fab" onclick="openModal()">
            <span>連絡</span>
            <span>管理員</span>
        </button>

        <iframe class="embedded-iframe" src="https://script.google.com/macros/s/AKfycbztuCbkZps66jGZRfDqZxboquvrgV5BJBurQQC9TOkUwF5xJYSID4bWLuRMLsCttl3U/exec"></iframe>

        <div class="modal-overlay" id="contactModal" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <span class="modal-title">連絡管理員</span>
                    <button class="close-btn" onclick="closeModal(event)">&times;</button>
                </div>
                <div class="modal-body">
                    <iframe src="https://makeform.ai/f/yWavfV9t?mk-rm-bg=true" style="position:absolute;top:0;right:0;bottom:0;left:0;border:0;width:100%;height:100%;" title="114青埔國中暑假綜合測驗系統管理員聯絡表單"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 開啟視窗
        function openModal() {
            document.getElementById('contactModal').style.display = 'flex';
        }

        // 關閉視窗
        function closeModal(event) {
            document.getElementById('contactModal').style.display = 'none';
        }

        /* ------------------------------------------------------------
           防 F12 與防開發者工具檢測機制（偵測到即重新整理）
        ------------------------------------------------------------ */
        
        // 執行重新整理的函式
        function doReload() {
            window.location.reload();
        }

        // 1. 攔截常見快捷鍵：F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U
        window.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
            ) {
                e.preventDefault();
                doReload();
            }
        });

        // 2. 透過檢測視窗內部與外部的尺寸差（適用於主控台被垂直或水平分割嵌入在瀏覽器內的情況）
        function checkThreshold() {
            const threshold = 160; // 觸發閾值（像素）
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;
            
            if (widthThreshold || heightThreshold) {
                doReload();
            }
        }
        // 每秒檢查一次視窗大小是否異常變動
        setInterval(checkThreshold, 1000);
        window.addEventListener('resize', checkThreshold);

        // 3. 透過 console.log 的屬性讀取延遲檢測（最強力，防獨立視窗或側邊欄主控台）
        // 當主控台關閉時，它不會讀取 element 的 id；當主控台被打開時，它會觸發屬性讀取
        (function() {
            const devtools = /./;
            devtools.toString = function() {
                doReload();
                return '';
            };
            
            setInterval(function() {
                // 持續在背景呼叫，如果主控台開著就會執行 toString
                console.log('%c', devtools);
                console.clear();
            }, 1000);
        })();
    </script>

</body>
</html>

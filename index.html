<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青埔國中114暑假綜合測驗系統</title>
    <link rel="icon" href="https://cloudflareimg.cdn.sn/i/6a210704c6b2e_1780549380.jpeg" type="image/jpeg">
    
    <!-- 載入 Google 官方新版登入認證庫 (Google Identity Services) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* 移除瀏覽器預設的邊距，讓網頁全螢幕顯示 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Headline Chinas", "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .embedded-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 右下角圓形連絡管理員按鈕 */
        .makeform-slider-trigger.contact-fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 9999;
            transition: background-color 0.2s, transform 0.2s;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.2;
            cursor: pointer;
            padding: 0;
        }

        .makeform-slider-trigger.contact-fab:hover {
            background-color: #1557b0;
            transform: scale(1.05);
        }

        /* 隱密管理員齒輪按鈕 */
        .admin-gear-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 2147483647;
            opacity: 0.5;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .admin-gear-btn:hover {
            opacity: 1;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 滿版強制登入遮罩 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f9fa;
            z-index: 2147483647;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-logo {
            max-width: 100px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .login-card h2 {
            font-size: 20px;
            color: #202124;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .login-card p {
            font-size: 14px;
            color: #5f6368;
            margin: 0 0 30px 0;
            line-height: 1.5;
        }

        /* 登入小區塊的動態隱現 */
        .sub-section {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .sub-section.active {
            display: flex;
        }

        /* 確認身份的二選一按鈕樣式 */
        .confirm-btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-btn.yes {
            background-color: #1a73e8;
            color: white;
        }

        .action-btn.yes:hover {
            background-color: #1557b0;
        }

        .action-btn.no {
            background-color: #f1f3f4;
            color: #3c4043;
            border: 1px solid #dadce0;
        }

        .action-btn.no:hover {
            background-color: #e8eaed;
        }

        .login-error {
            color: #d93025;
            font-size: 13px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
            background: #fce8e6;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        /* 管理員控制台樣式 */
        .admin-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2147483647;
        }

        .admin-modal-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 450px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .admin-modal-header {
            background-color: #f1f3f4;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dadce0;
        }

        .admin-modal-title {
            font-size: 16px;
            font-weight: bold;
            color: #202124;
        }

        .admin-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #5f6368;
            line-height: 1;
        }

        .admin-panel-body {
            padding: 20px 25px;
            color: #3c4043;
            max-height: 480px;
            overflow-y: auto;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #f1f3f4;
        }

        .setting-item.vertical {
            flex-direction: column;
            align-items: flex-start;
        }

        .setting-info .setting-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .setting-info .setting-desc {
            font-size: 12px;
            color: #70757a;
        }

        .admin-input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 8px;
            font-family: inherit;
        }

        .admin-input:focus {
            border-color: #1a73e8;
            outline: none;
        }

        .save-settings-btn {
            width: 100%;
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .save-settings-btn:hover {
            background-color: #1557b0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #1a73e8;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* 系統維護遮罩 */
        .maintenance-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 9990;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .maintenance-title {
            font-size: 28px;
            font-weight: bold;
            color: #d93025;
            margin-bottom: 15px;
        }

        .maintenance-overlay img {
            max-width: 150px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .maintenance-overlay .maintenance-desc {
            font-size: 16px;
            color: #5f6368;
            max-width: 600px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- 桃園青埔國中限定 - 強制登入頁面 -->
    <div class="login-overlay" id="loginPage">
        <div class="login-card">
            <img class="login-logo" src="https://cloudflareimg.cdn.sn/i/6a210704c6b2e_1780549380.jpeg" alt="Logo">
            <h2>學校帳號身份驗證</h2>
            
            <!-- 第一步：顯示 Google 登入按鈕 -->
            <div class="sub-section active" id="step1_google">
                <p>本測驗系統僅限桃園市青埔國中師生使用。<br>[管理員公告]近日有人反應登入顯示找不到帳號，<br>麻煩請透過右下角聯絡管理員來讓我們知道，<br>且送出請留意填寫的email有無收到管理員寄來的通知信，謝謝。[公告結束]<br>請點擊下方按鈕，並使用您的 <strong>@qpjh.tyc.edu.tw</strong> 學校雲端帳號登入系統。</p>
                <div id="googleLoginBtn"></div>
            </div>

            <!-- 第二步：動態抓取試算表後的身份確認對話框 -->
            <div class="sub-section" id="step2_confirm">
                <p style="font-size: 16px; color: #202124; font-weight: bold; margin-bottom: 15px;">🔍 查閱到您的考場資料：</p>
                <p id="parsedStudentInfo" style="font-size: 18px; color: #1a73e8; font-weight: bold; background: #e8f0fe; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; margin: 0 0 20px 0;"></p>
                <p style="font-size: 14px; color: #5f6368; margin: 0 0 20px 0;">請問是否直接以此身份登入系統？</p>
                <div class="confirm-btn-group">
                    <button class="action-btn yes" onclick="confirmLoginWithGoogleData()">是 (自動登入)</button>
                    <button class="action-btn no" onclick="rejectAndGotoManual()">否 (手動輸入)</button>
                </div>
            </div>
            
            <!-- 錯誤提示區域 -->
            <div class="login-error" id="loginErrorMsg"></div>
        </div>
    </div>

    <!-- 核心功能主要容器 -->
    <div class="container">
        <!-- 系統維護遮罩頁面 -->
        <div class="maintenance-overlay" id="maintenancePage">
            <img src="https://cloudflareimg.cdn.sn/i/6a210704c6b2e_1780549380.jpeg" alt="Logo">
            <div class="maintenance-title" id="displayMaintTitle">系統維護中</div>
            <div class="maintenance-desc" id="displayMaintDesc">本測驗系統目前暫停開放，請靜待管理員公告開啟。</div>
        </div>

        <!-- 隱密管理員齒輪按鈕 -->
        <div class="admin-gear-btn" onclick="triggerAdminAccess()">⚙️</div>

        <!-- 右下角圓形浮動按鈕 -->
        <button 
            data-makeform-slider="https://makeform.ai/e/yWavfV9t?__mf_modal_embed=1" 
            data-makeform-width="800" 
            data-makeform-auto-close="3" 
            class="makeform-slider-trigger contact-fab">
            <span>連絡</span>
            <span>管理員</span>
        </button>

        <!-- 嵌入的原始系統網頁 -->
        <iframe id="systemIframe" class="embedded-iframe" src="https://script.google.com/macros/s/AKfycbztuCbkZps66jGZRfDqZxboquvrgV5BJBurQQC9TOkUwF5xJYSID4bWLuRMLsCttl3U/exec"></iframe>

        <!-- 管理員獨立後台視窗 -->
        <div class="admin-modal-overlay" id="adminModal" onclick="closeAdminModal()">
            <div class="admin-modal-content" onclick="event.stopPropagation()">
                <div class="admin-modal-header">
                    <span class="admin-modal-title">⚙️ 管理員控制台</span>
                    <button class="admin-close-btn" onclick="closeAdminModal()">&times;</button>
                </div>
                <div class="admin-panel-body">
                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">同步關閉/開啟 綜合測驗網頁</div>
                            <div class="setting-desc">啟用後會強制所有線上學生端阻擋或開放畫面。</div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="toggleMaintenance" onchange="handleUIChangeLocally(); forceStopPolling();">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-item vertical">
                        <div class="setting-info">
                            <div class="setting-title">編輯維護畫面標題</div>
                        </div>
                        <input type="text" id="inputMaintTitle" class="admin-input" placeholder="例如：系統維護中" oninput="handleUIChangeLocally()" onfocus="forceStopPolling()">
                    </div>

                    <div class="setting-item vertical">
                        <div class="setting-info">
                            <div class="setting-title">編輯維護畫面內文</div>
                        </div>
                        <textarea id="inputMaintDesc" class="admin-input" rows="3" placeholder="例如：本測驗系統目前暫停開放..." oninput="handleUIChangeLocally()" onfocus="forceStopPolling()"></textarea>
                    </div>

                    <button class="save-settings-btn" onclick="syncSettingsToCloud()">立即將變更同步至雲端</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = "719087801312-1qprj8q9s6rq04qki2lo20go6rsg77p5.apps.googleusercontent.com";
        const ADMIN_PASSWORD = "admin707";
        const SYNC_API_URL = "https://script.google.com/macros/s/AKfycbxn1jGfKmaPwWRzuBSnn_KEhHkyyupn-Og5Ki4HQ8c7fOQBDV9TvAoomggZGD1xTUeV/exec";
        const BASE_SYSTEM_URL = "https://script.google.com/macros/s/AKfycbztuCbkZps66jGZRfDqZxboquvrgV5BJBurQQC9TOkUwF5xJYSID4bWLuRMLsCttl3U/exec";

        let pollingTimer = null;
        let isLocalChanging = false;
        
        // 用於背景暫存解析出來的 Email 資料
        let globalVerifiedEmail = "";

        /* ------------------------------------------------------------
           桃園青埔國中限定：Google OAuth 網域驗證模組
        ------------------------------------------------------------ */
        window.onload = function () {
            if (GOOGLE_CLIENT_ID === "這裡放你的Google用戶端ID.apps.googleusercontent.com") {
                document.getElementById('loginPage').style.display = 'none';
            } else {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleCredentialResponse,
                    auto_select: false,
                    itp_support: true
                });
                google.accounts.id.renderButton(
                    document.getElementById("googleLoginBtn"),
                    { theme: "outline", size: "large", width: "240" }
                );
            }
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const userData = parseJwt(response.credential);
            const userEmail = userData.email.toLowerCase();
            const errorMsgEl = document.getElementById('loginErrorMsg');

            if (userEmail.endsWith('@qpjh.tyc.edu.tw')) {
                errorMsgEl.style.display = 'none';
                globalVerifiedEmail = userEmail;

                // 核心改動：登入成功後，立刻連線到你的狀態試算表 API 反查這個學生名單
                // 假設你的 API 有支援撈取名字（如果沒有撈到，則預設直接顯示 Email 供確認）
                fetch(`${SYNC_API_URL}?action=getStudent&email=${encodeURIComponent(userEmail)}`)
                    .then(res => res.json())
                    .then(studentData => {
                        let displayText = "";
                        if (studentData && studentData.class) {
                            displayText = `${studentData.class} 班 ${studentData.seat} 號 ${studentData.name}`;
                        } else {
                            // 降級防護：萬一後端名冊沒對應到，則直接顯示他的 Google 姓名與 Email
                            displayText = `${userData.name || '學生'} (${userEmail})`;
                        }
                        
                        document.getElementById('parsedStudentInfo').innerText = displayText;
                        
                        // 面版切換：隱藏 Google 按鈕，跳出詢問字卡
                        document.getElementById('step1_google').classList.remove('active');
                        document.getElementById('step2_confirm').classList.add('active');
                    })
                    .catch(err => {
                        // 異常防護：API 有誤差時直接大方顯示 Email 供確認
                        document.getElementById('parsedStudentInfo').innerText = userEmail;
                        document.getElementById('step1_google').classList.remove('active');
                        document.getElementById('step2_confirm').classList.add('active');
                    });

            } else {
                errorMsgEl.style.display = 'block';
                errorMsgEl.innerText = `拒絕存取：不允許使用 [${userEmail}]。系統僅允許學校官方 @qpjh.tyc.edu.tw 帳號登入。`;
            }
        }

        /* ------------------------------------------------------------
           動態按鈕事件處理：是 (自動登入) / 否 (退回到原本手動登入畫面)
        ------------------------------------------------------------ */
        // 點選「是」：自動放行並帶入 Google Email 參數
        function confirmLoginWithGoogleData() {
            const targetIframe = document.getElementById('systemIframe');
            targetIframe.src = `${BASE_SYSTEM_URL}?email=${encodeURIComponent(globalVerifiedEmail)}`;
            document.getElementById('loginPage').style.display = 'none';
        }

        // 點選「否」：直接徹底解開遮罩，露出原本系統的手動登入畫面
        function rejectAndGotoManual() {
            // 因為學生選「否」，代表他要手動輸入，我們不要往網址帶入 email 參數
            const targetIframe = document.getElementById('systemIframe');
            targetIframe.src = BASE_SYSTEM_URL; 
            
            // 直接收起遮罩，露出主程式手動登入介面
            document.getElementById('loginPage').style.display = 'none';
        }

        /* ------------------------------------------------------------
           管理端模組：密碼與控制台
         ------------------------------------------------------------ */
        function triggerAdminAccess() {
            const passwordInput = prompt("請輸入管理員密碼：");
            if (passwordInput === ADMIN_PASSWORD) {
                forceStopPolling();
                document.getElementById('adminModal').style.display = 'flex';
            } else if (passwordInput !== null) {
                alert("密碼錯誤，拒絕進入管理端。");
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
            if (isLocalChanging) {
                isLocalChanging = false;
                startPolling();
            }
        }

        function handleUIChangeLocally() {
            const isChecked = document.getElementById('toggleMaintenance').checked;
            const titleText = document.getElementById('inputMaintTitle').value || "系統維護中";
            const descText = document.getElementById('inputMaintDesc').value || "本測驗系統目前暫停開放，請靜待管理員公告開啟。";

            const maintenanceOverlay = document.getElementById('maintenancePage');
            maintenanceOverlay.style.display = isChecked ? 'flex' : 'none';
            document.getElementById('displayMaintTitle').innerText = titleText;
            document.getElementById('displayMaintDesc').innerText = descText;
        }

        function forceStopPolling() {
            isLocalChanging = true;
            if (pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
            }
        }

        function syncSettingsToCloud() {
            forceStopPolling();

            const isChecked = document.getElementById('toggleMaintenance').checked;
            const titleText = document.getElementById('inputMaintTitle').value;
            const descText = document.getElementById('inputMaintDesc').value;

            fetch(SYNC_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    status: isChecked,
                    title: titleText,
                    desc: descText
                })
            })
            .then(() => {
                alert("雲端同步成功！所有在線學生畫面皆已同步。");
                setTimeout(() => {
                    isLocalChanging = false;
                    startPolling();
                }, 3500);
            })
            .catch(err => {
                console.error("雲端同步失敗:", err);
                isLocalChanging = false;
                startPolling();
            });
        }

        /* ------------------------------------------------------------
           同步輪詢機制：每 5 秒自動讀取雲端試算表的最新狀態
        ------------------------------------------------------------ */
        function checkCloudStatus() {
            if (isLocalChanging) return;

            fetch(SYNC_API_URL)
                .then(res => res.json())
                .then(data => {
                    if (isLocalChanging) return; 
                    
                    if (data) {
                        if (typeof data.maintenance !== 'undefined') {
                            document.getElementById('toggleMaintenance').checked = data.maintenance;
                            document.getElementById('maintenancePage').style.display = data.maintenance ? 'flex' : 'none';
                        }
                        if (data.title) {
                            document.getElementById('inputMaintTitle').value = data.title;
                            document.getElementById('displayMaintTitle').innerText = data.title;
                        }
                        if (data.desc) {
                            document.getElementById('inputMaintDesc').value = data.desc;
                            document.getElementById('displayMaintDesc').innerText = data.desc;
                        }
                    }
                })
                .catch(err => console.error("無法取得雲端狀態:", err));
        }
        
        function startPolling() {
            if (!pollingTimer) {
                pollingTimer = setInterval(checkCloudStatus, 5000);
            }
        }
        
        checkCloudStatus();
        startPolling();

        /* ------------------------------------------------------------
           常駐功能：防 F12 與防開發者工具檢測機制
        ------------------------------------------------------------ */
        function doReload() {
            window.location.reload();
        }

        window.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
            ) {
                e.preventDefault();
                doReload();
            }
        });

        setInterval(function() {
            const startTime = performance.now();
            debugger; 
            const endTime = performance.now();
            if (endTime - startTime > 100) {
                doReload();
            }
        }, 500);
    </script>

</body>
</html>
